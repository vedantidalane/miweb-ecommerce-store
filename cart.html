<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Cart – ShopZone</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/features2.css"/>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-shopping-bag me-2"></i>ShopZone</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMenu">
      <form class="d-flex mx-auto search-bar" onsubmit="event.preventDefault();window.location.href='products.html?search='+encodeURIComponent(this.querySelector('input').value);">
        <input class="form-control" type="search" placeholder="Search products…"/>
        <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i></button>
      </form>
      <ul class="navbar-nav ms-3 align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="products.html"><i class="fas fa-th me-1"></i>Products</a></li>
        <li class="nav-item"><a class="nav-link" href="wishlist.html"><i class="fas fa-heart me-1"></i>Wishlist <span class="cart-badge" id="wishlistCount">0</span></a></li>
        <li class="nav-item"><a class="nav-link" href="compare.html"><i class="fas fa-exchange-alt me-1"></i>Compare</a></li>
        <li class="nav-item"><a class="nav-link active" href="cart.html"><i class="fas fa-shopping-cart me-1"></i>Cart <span class="cart-badge" id="cartCount">0</span></a></li>
        <li class="nav-item" id="authNav"><a class="nav-link" href="login.html"><i class="fas fa-user me-1"></i>Login</a></li>
        <li class="nav-item"><button class="theme-toggle ms-2" id="themeToggle" onclick="toggleTheme()"></button></li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-breadcrumb">
  <div class="container">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="index.html">Home</a></li>
      <li class="breadcrumb-item active">Shopping Cart</li>
    </ol>
  </div>
</div>

<section class="py-5">
  <div class="container">
    <h1 class="section-title mb-4">Shopping Cart</h1>
    <div class="row g-4" id="cartSection">
      <!-- Rendered by JS -->
    </div>
  </div>
</section>

<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  // ── Advanced Coupon System ──
  const COUPONS = [
    {
      code: 'SAVE10',
      type: 'percentage',
      value: 10,
      description: '10% Off on your order',
      terms: 'No minimum order value. Valid on all products.',
      minOrder: 0,
      maxDiscount: Infinity,
      expiry: null,
      oneTime: false,
      icon: '🏷️'
    },
    {
      code: 'FLAT200',
      type: 'flat',
      value: 200,
      description: '₹200 Flat Off',
      terms: 'Minimum order value ₹999.',
      minOrder: 999,
      maxDiscount: 200,
      expiry: null,
      oneTime: false,
      icon: '💰'
    },
    {
      code: 'FIRST50',
      type: 'percentage',
      value: 50,
      description: '50% Off for First Order',
      terms: 'Max discount ₹500. One-time use only.',
      minOrder: 0,
      maxDiscount: 500,
      expiry: null,
      oneTime: true,
      icon: '🎉'
    },
    {
      code: 'FREESHIP',
      type: 'freeshipping',
      value: 0,
      description: 'Free Shipping',
      terms: 'Minimum order value ₹299. Removes shipping charges.',
      minOrder: 299,
      maxDiscount: 0,
      expiry: null,
      oneTime: false,
      icon: '🚚'
    },
    {
      code: 'BUY1GET1',
      type: 'bogo',
      value: 0,
      description: 'Buy 1 Get 1 Free on Electronics',
      terms: 'Applies to electronics category. Cheapest item free.',
      minOrder: 0,
      maxDiscount: Infinity,
      expiry: null,
      oneTime: false,
      category: 'electronics',
      icon: '🎁'
    }
  ];

  function getUsedCoupons() {
    return JSON.parse(localStorage.getItem('shopzone_used_coupons') || '[]');
  }

  function markCouponUsed(code) {
    const used = getUsedCoupons();
    if (!used.includes(code)) {
      used.push(code);
      localStorage.setItem('shopzone_used_coupons', JSON.stringify(used));
    }
  }

  function validateCoupon(code) {
    const coupon = COUPONS.find(c => c.code === code);
    if (!coupon) return { valid: false, message: 'Invalid coupon code.' };

    const cart = getCart();
    const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);

    // Check expiry
    if (coupon.expiry && new Date() > new Date(coupon.expiry)) {
      return { valid: false, message: `Coupon "${code}" has expired.` };
    }

    // Check minimum order
    if (subtotal < coupon.minOrder) {
      return { valid: false, message: `Minimum order of ₹${coupon.minOrder.toLocaleString()} required for "${code}".` };
    }

    // Check one-time use
    if (coupon.oneTime && getUsedCoupons().includes(code)) {
      return { valid: false, message: `Coupon "${code}" has already been used.` };
    }

    // Check BOGO – need electronics items
    if (coupon.type === 'bogo') {
      const catItems = cart.filter(item => {
        const p = PRODUCTS.find(pr => pr.id === item.id);
        return p && p.category === coupon.category;
      });
      if (catItems.length < 2) {
        return { valid: false, message: `Need at least 2 ${coupon.category} items for BOGO offer.` };
      }
    }

    return { valid: true, coupon };
  }

  function calculateAdvancedDiscount(couponCode) {
    const cart = getCart();
    const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
    let discount = 0;
    let freeShipping = false;
    let discountLabel = '';

    if (!couponCode) return { discount: 0, freeShipping: false, discountLabel: '' };

    const coupon = COUPONS.find(c => c.code === couponCode);
    if (!coupon) return { discount: 0, freeShipping: false, discountLabel: '' };

    switch (coupon.type) {
      case 'percentage':
        discount = Math.round(subtotal * (coupon.value / 100));
        if (discount > coupon.maxDiscount) discount = coupon.maxDiscount;
        discountLabel = `${coupon.value}% off`;
        break;
      case 'flat':
        discount = Math.min(coupon.value, subtotal);
        discountLabel = `₹${coupon.value} flat off`;
        break;
      case 'freeshipping':
        freeShipping = true;
        discount = 0;
        discountLabel = 'Free shipping';
        break;
      case 'bogo':
        // Find electronics items, make cheapest free
        const elecItems = [];
        cart.forEach(item => {
          const p = PRODUCTS.find(pr => pr.id === item.id);
          if (p && p.category === coupon.category) {
            for (let i = 0; i < item.qty; i++) elecItems.push(item.price);
          }
        });
        elecItems.sort((a, b) => a - b);
        // Half the items are free (cheapest ones)
        const freeCount = Math.floor(elecItems.length / 2);
        for (let i = 0; i < freeCount; i++) discount += elecItems[i];
        discountLabel = 'BOGO (cheapest free)';
        break;
    }

    return { discount, freeShipping, discountLabel };
  }

  function getCartTotalsAdvanced() {
    const cart = getCart();
    const couponCode = localStorage.getItem('shopzone_coupon') || '';
    const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const { discount, freeShipping, discountLabel } = calculateAdvancedDiscount(couponCode);
    let shipping = subtotal - discount > 499 ? 0 : 49;
    if (freeShipping) shipping = 0;
    const total = Math.max(0, subtotal - discount + shipping);
    return { subtotal, discount, shipping, total, coupon: couponCode, freeShipping, discountLabel };
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateCartCount();
    checkAuth();
    if (typeof updateWishlistCount === 'function') updateWishlistCount();
    renderCart();
  });

  function renderCart() {
    const cart = getCart();
    const section = document.getElementById('cartSection');
    if (cart.length === 0) {
      section.innerHTML = `<div class="col-12">
        <div class="empty-state">
          <i class="fas fa-shopping-cart"></i>
          <h4>Your cart is empty</h4>
          <p>Looks like you haven't added anything yet.</p>
          <a href="products.html" class="btn btn-primary rounded-pill mt-3 px-4"><i class="fas fa-shopping-bag me-2"></i>Start Shopping</a>
        </div></div>`;
      return;
    }

    const { subtotal, discount, shipping, total, coupon, freeShipping, discountLabel } = getCartTotalsAdvanced();
    const appliedCoupon = COUPONS.find(c => c.code === coupon);

    section.innerHTML = `
      <div class="col-lg-8">
        <div id="cartItems">${cart.map(renderCartItem).join('')}</div>
        <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
          <a href="products.html" class="btn btn-outline-secondary rounded-pill"><i class="fas fa-arrow-left me-2"></i>Continue Shopping</a>
          <button class="btn btn-outline-danger rounded-pill" onclick="clearCart()"><i class="fas fa-trash me-2"></i>Clear Cart</button>
        </div>

        <!-- Available Coupons Section -->
        <div class="coupon-section mt-4">
          <h5><i class="fas fa-tags me-2 text-primary"></i>Available Coupons</h5>
          <div id="couponCards">${renderCouponCards(coupon)}</div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="summary-card">
          <h5 class="fw-700 mb-4"><i class="fas fa-receipt me-2 text-primary"></i>Order Summary</h5>
          <div class="summary-row"><span>Subtotal (${cart.reduce((s,i)=>s+i.qty,0)} items)</span><span>₹${subtotal.toLocaleString()}</span></div>
          ${discount > 0 ? `
            <div class="summary-row text-success"><span>Coupon Discount (${coupon})</span><span>-₹${discount.toLocaleString()}</span></div>
            <div class="discount-breakdown">
              <div class="breakdown-item"><span><i class="fas fa-tag me-1"></i>${discountLabel}</span><span>-₹${discount.toLocaleString()}</span></div>
              <div class="breakdown-item total"><span>You Save</span><span>₹${discount.toLocaleString()}</span></div>
            </div>
          ` : ''}
          ${freeShipping && shipping === 0 ? `<div class="summary-row text-success"><span>Shipping</span><span><i class="fas fa-truck me-1"></i>FREE (coupon)</span></div>` :
            `<div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? '<span class="text-success fw-600">FREE</span>' : '₹'+shipping}</span></div>`}
          <div class="summary-row summary-total"><span>Total</span><span class="text-primary">₹${total.toLocaleString()}</span></div>

          <!-- Coupon Input -->
          <div class="mt-4">
            <label class="form-label fw-600 small">Apply Coupon Code</label>
            <div class="coupon-input">
              <input type="text" class="form-control form-control-sm" id="couponInput" placeholder="Enter coupon code..." value="${coupon}"/>
              ${coupon ? `<button class="btn btn-outline-danger btn-sm" onclick="removeCoupon()"><i class="fas fa-times"></i></button>` : ''}
              <button class="btn btn-outline-primary btn-sm" onclick="applyCouponAdvanced()">Apply</button>
            </div>
            ${coupon && appliedCoupon ? `<div class="text-success small mt-1"><i class="fas fa-check-circle me-1"></i>"${coupon}" applied – ${appliedCoupon.description}</div>` : ''}
          </div>

          <a href="checkout.html" class="btn-primary-custom d-block text-center text-decoration-none mt-4">
            <i class="fas fa-lock me-2"></i>Proceed to Checkout
          </a>
          <div class="text-center mt-2 small text-muted"><i class="fas fa-shield-alt me-1"></i>Secure & encrypted checkout</div>
        </div>
      </div>`;
  }

  function renderCartItem(item) {
    return `
      <div class="cart-item">
        <img src="${item.image}" alt="${item.name}"/>
        <div class="flex-grow-1">
          <h6 class="fw-600 mb-1">${item.name}</h6>
          <div class="text-primary fw-700">₹${item.price.toLocaleString()}</div>
          <div class="text-muted small">Subtotal: ₹${(item.price * item.qty).toLocaleString()}</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty(${item.id}, -1)"><i class="fas fa-minus"></i></button>
          <span class="qty-value">${item.qty}</span>
          <button class="qty-btn" onclick="updateQty(${item.id}, 1)"><i class="fas fa-plus"></i></button>
        </div>
        <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="removeFromCart(${item.id})"><i class="fas fa-times"></i></button>
      </div>`;
  }

  function renderCouponCards(activeCoupon) {
    const cart = getCart();
    const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);

    return COUPONS.map(c => {
      const isApplied = activeCoupon === c.code;
      const validation = validateCoupon(c.code);
      const isDisabled = !validation.valid && !isApplied;
      const disabledReason = !validation.valid ? validation.message : '';

      return `
        <div class="coupon-card ${isApplied ? 'applied' : ''} ${isDisabled ? 'opacity-75' : ''}">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <span class="coupon-code">${c.code}</span>
              ${isApplied ? '<span class="coupon-badge-tag"><i class="fas fa-check me-1"></i>Applied</span>' : ''}
              ${c.oneTime ? '<span class="coupon-badge-tag" style="background:linear-gradient(135deg,#ff6584,#ff4da6);">First Order</span>' : ''}
            </div>
            <span style="font-size:1.5rem;">${c.icon}</span>
          </div>
          <div class="coupon-desc">${c.description}</div>
          <div class="coupon-terms">${c.terms}</div>
          ${isDisabled ? `<div class="text-danger small mt-1"><i class="fas fa-info-circle me-1"></i>${disabledReason}</div>` : ''}
          <div class="coupon-actions">
            ${isApplied ?
              `<button class="btn btn-outline-danger" onclick="removeCoupon()"><i class="fas fa-times me-1"></i>Remove</button>` :
              `<button class="btn btn-outline-primary" onclick="copyCoupon('${c.code}')" ${isDisabled ? 'disabled' : ''}><i class="fas fa-copy me-1"></i>Copy</button>
               <button class="btn btn-primary text-white" onclick="applyThisCoupon('${c.code}')" ${isDisabled ? 'disabled' : ''}><i class="fas fa-check me-1"></i>Apply</button>`
            }
          </div>
        </div>`;
    }).join('');
  }

  function applyCouponAdvanced() {
    const code = document.getElementById('couponInput').value.trim().toUpperCase();
    if (!code) {
      removeCoupon();
      return;
    }
    applyThisCoupon(code);
  }

  function applyThisCoupon(code) {
    const result = validateCoupon(code);
    if (!result.valid) {
      showToast(result.message, 'danger');
      return;
    }
    localStorage.setItem('shopzone_coupon', code);
    showToast(`Coupon "${code}" applied successfully! 🎉`, 'success');
    renderCart();
  }

  function removeCoupon() {
    localStorage.removeItem('shopzone_coupon');
    showToast('Coupon removed.', 'warning');
    renderCart();
  }

  function copyCoupon(code) {
    navigator.clipboard.writeText(code).then(() => {
      showToast(`Coupon code "${code}" copied! 📋`, 'info');
      const input = document.getElementById('couponInput');
      if (input) input.value = code;
    }).catch(() => {
      // Fallback
      const input = document.getElementById('couponInput');
      if (input) input.value = code;
      showToast(`Code "${code}" ready to apply!`, 'info');
    });
  }

  function clearCart() {
    if (confirm('Are you sure you want to clear the cart?')) {
      localStorage.removeItem('shopzone_cart');
      localStorage.removeItem('shopzone_coupon');
      updateCartCount();
      renderCart();
      showToast('Cart cleared!', 'warning');
    }
  }
</script>
</body>
</html>
