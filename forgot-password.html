<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – ShopZone</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page">
<div class="container">
  <div class="auth-card fade-in">
    <div class="text-center mb-4">
      <a href="index.html" class="navbar-brand mb-3 d-block"><i class="fas fa-shopping-bag me-2"></i>ShopZone</a>
      <div style="font-size:3rem;">🔐</div>
      <h1 class="auth-title mt-2">Forgot Password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send reset instructions.</p>
    </div>
    <div id="step1">
      <form id="forgotForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="forgotEmail" placeholder="you@example.com" required/>
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>
        <button type="submit" class="btn-primary-custom">
          <span id="fgSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
          <i class="fas fa-paper-plane me-2"></i>Send Reset Link
        </button>
      </form>
    </div>
    <div id="step2" class="d-none text-center">
      <div style="font-size:3rem;">📧</div>
      <h5 class="fw-700 mt-3">Check Your Email!</h5>
      <p class="text-muted">We've sent reset instructions to <strong id="sentTo"></strong></p>
      <div class="alert alert-info small mt-3">
        <i class="fas fa-info-circle me-2"></i>This is a demo – no real email is sent.
      </div>
      <a href="login.html" class="btn-primary-custom d-block text-center text-decoration-none mt-3"><i class="fas fa-sign-in-alt me-2"></i>Back to Login</a>
    </div>
    <p class="text-center text-secondary small mt-3 mb-0">
      Remember your password? <a href="login.html" class="text-primary text-decoration-none">Sign In</a>
    </p>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/cart.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', function(e) {
    e.preventDefault();
    this.classList.add('was-validated');
    if (!this.checkValidity()) return;
    const email = document.getElementById('forgotEmail').value;
    const spinner = document.getElementById('fgSpinner');
    spinner.classList.remove('d-none');
    setTimeout(() => {
      spinner.classList.add('d-none');
      document.getElementById('step1').classList.add('d-none');
      document.getElementById('sentTo').textContent = email;
      document.getElementById('step2').classList.remove('d-none');
    }, 1500);
  });
</script>
</body>
</html>
