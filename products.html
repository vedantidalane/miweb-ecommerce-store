<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products – ShopZone</title>
  <meta name="description" content="Browse all products at ShopZone with filters, search and sorting."/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-shopping-bag me-2"></i>ShopZone</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <form class="d-flex mx-auto search-bar">
        <input class="form-control" type="search" id="searchInput" placeholder="Search products…"/>
        <button class="btn btn-primary" type="button" onclick="applyFilters()"><i class="fas fa-search"></i></button>
      </form>
      <ul class="navbar-nav ms-3 align-items-center gap-1">
        <li class="nav-item"><a class="nav-link active" href="products.html"><i class="fas fa-th me-1"></i>Products</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart me-1"></i>Cart <span class="cart-badge" id="cartCount">0</span></a></li>
        <li class="nav-item" id="authNav"><a class="nav-link" href="login.html"><i class="fas fa-user me-1"></i>Login</a></li>
        <li class="nav-item">
          <button class="theme-toggle ms-2" id="themeToggle" onclick="toggleTheme()"></button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-breadcrumb">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Products</li>
      </ol>
    </nav>
  </div>
</div>

<section class="py-5">
  <div class="container">
    <div class="row g-4">
      <!-- Filter Sidebar -->
      <div class="col-lg-3">
        <div class="filter-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0"><i class="fas fa-filter me-2 text-primary"></i>Filters</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="clearFilters()">Clear All</button>
          </div>

          <!-- Category -->
          <div class="filter-section">
            <h6 class="fw-700 mb-3">Category</h6>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="cat" id="catAll" value="" checked onchange="applyFilters()"><label class="form-check-label" for="catAll">All Categories</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="cat" id="catElec" value="electronics" onchange="applyFilters()"><label class="form-check-label" for="catElec">📱 Electronics</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="cat" id="catFash" value="fashion" onchange="applyFilters()"><label class="form-check-label" for="catFash">👗 Fashion</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="cat" id="catHome" value="home" onchange="applyFilters()"><label class="form-check-label" for="catHome">🏠 Home & Living</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="cat" id="catSport" value="sports" onchange="applyFilters()"><label class="form-check-label" for="catSport">⚽ Sports</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="cat" id="catBeauty" value="beauty" onchange="applyFilters()"><label class="form-check-label" for="catBeauty">💄 Beauty</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="cat" id="catBooks" value="books" onchange="applyFilters()"><label class="form-check-label" for="catBooks">📚 Books</label></div>
          </div>

          <!-- Price Range -->
          <div class="filter-section">
            <h6 class="fw-700 mb-3">Price Range</h6>
            <div class="d-flex gap-2 mb-2">
              <input type="number" class="form-control" id="minPrice" placeholder="Min ₹" onchange="applyFilters()"/>
              <input type="number" class="form-control" id="maxPrice" placeholder="Max ₹" onchange="applyFilters()"/>
            </div>
            <input type="range" class="form-range" id="priceRange" min="0" max="150000" step="500" value="150000" oninput="updatePriceRange(this.value)"/>
            <div class="d-flex justify-content-between small text-muted">
              <span>₹0</span><span id="priceRangeVal">₹1,50,000</span>
            </div>
          </div>

          <!-- Sort -->
          <div class="filter-section">
            <h6 class="fw-700 mb-3">Sort By</h6>
            <select class="form-select" id="sortBy" onchange="applyFilters()">
              <option value="">Default</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="name">Name A-Z</option>
            </select>
          </div>

          <!-- Availability -->
          <div class="filter-section">
            <h6 class="fw-700 mb-3">Availability</h6>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="inStockOnly" onchange="applyFilters()"><label class="form-check-label" for="inStockOnly">In Stock Only</label></div>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="section-title">All Products</h2>
          <span class="text-muted small" id="resultCount">Showing 0 products</span>
        </div>
        <div class="row g-4" id="productsGrid"></div>
      </div>
    </div>
  </div>
</section>

<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    updateCartCount();
    checkAuth();
    // Read URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get('cat')) {
      const radio = document.querySelector(`input[name="cat"][value="${params.get('cat')}"]`);
      if (radio) radio.checked = true;
    }
    if (params.get('search')) document.getElementById('searchInput').value = params.get('search');
    applyFilters();
  });

  function updatePriceRange(val) {
    document.getElementById('maxPrice').value = val;
    document.getElementById('priceRangeVal').textContent = '₹' + Number(val).toLocaleString();
    applyFilters();
  }

  function applyFilters() {
    let products = [...PRODUCTS];
    const cat = document.querySelector('input[name="cat"]:checked')?.value || '';
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const minP = parseFloat(document.getElementById('minPrice').value) || 0;
    const maxP = parseFloat(document.getElementById('maxPrice').value) || Infinity;
    const sort = document.getElementById('sortBy').value;
    const inStock = document.getElementById('inStockOnly').checked;

    if (cat) products = products.filter(p => p.category === cat);
    if (search) products = products.filter(p => p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search));
    products = products.filter(p => p.price >= minP && p.price <= maxP);
    if (inStock) products = products.filter(p => p.available !== false);

    if (sort === 'price-low') products.sort((a,b) => a.price - b.price);
    else if (sort === 'price-high') products.sort((a,b) => b.price - a.price);
    else if (sort === 'rating') products.sort((a,b) => b.rating - a.rating);
    else if (sort === 'name') products.sort((a,b) => a.name.localeCompare(b.name));

    const grid = document.getElementById('productsGrid');
    document.getElementById('resultCount').textContent = `Showing ${products.length} product${products.length !== 1 ? 's' : ''}`;
    if (products.length === 0) {
      grid.innerHTML = `<div class="col-12"><div class="empty-state"><i class="fas fa-search"></i><h4>No products found</h4><p>Try changing your search or filter criteria.</p></div></div>`;
    } else {
      grid.innerHTML = products.map(renderProductCard).join('');
    }
  }

  function clearFilters() {
    document.querySelectorAll('input[name="cat"]')[0].checked = true;
    document.getElementById('searchInput').value = '';
    document.getElementById('minPrice').value = '';
    document.getElementById('maxPrice').value = '';
    document.getElementById('sortBy').value = '';
    document.getElementById('inStockOnly').checked = false;
    document.getElementById('priceRange').value = 150000;
    document.getElementById('priceRangeVal').textContent = '₹1,50,000';
    applyFilters();
  }
</script>
</body>
</html>
